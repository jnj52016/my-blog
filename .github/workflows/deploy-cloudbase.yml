name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$TCB_SECRET_ID" || { echo "Missing TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "Missing TCB_SECRET_KEY"; exit 1; }
          test -n "$TCB_ENV_ID" || { echo "Missing TCB_ENV_ID"; exit 1; }
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}

      - name: Authenticate with CloudBase
        timeout-minutes: 2
        run: tcb login --key --secretId "$TCB_SECRET_ID" --secretKey "$TCB_SECRET_KEY"
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy static site
        run: tcb hosting deploy ./dist / -e "$TCB_ENV_ID"
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
